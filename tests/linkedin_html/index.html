<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedMe Extractor Test</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        color: #d4d4d4;
        background: #1e1e1e;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      pre {
        overflow-x: auto;
        padding: 20px;
        border: 1px solid #404040;
        border-radius: 8px;
        color: #9cdcfe;
        background: #2d2d2d;
      }
    </style>
  </head>
  <body>
    <h1>LinkedMe Extractor Test</h1>
    <p>Run this page from a local server so it can fetch the fixture files.</p>
    <pre id="output-display">Loading fixtures...</pre>

    <script type="module">
      import { extractEducation } from "../../extension/extractors/extractEducation.js";
      import { extractExperience } from "../../extension/extractors/extractExperience.js";
      import { extractVolunteering } from "../../extension/extractors/extractVolunteering.js";

      const output = document.getElementById("output-display");

      async function loadFixture(path) {
        const response = await fetch(path);

        if (!response.ok) {
          throw new Error(`Failed to load ${path}`);
        }

        return response.text();
      }

      try {
        const [educationHtml, experienceHtml, volunteeringHtml] = await Promise.all([
          loadFixture("../fixtures/linkedin_profile_education.txt"),
          loadFixture("../fixtures/linkedin_profile_experience.txt"),
          loadFixture("../fixtures/linkedin_profile_volunteering.txt"),
        ]);

        const extractedData = {
          education: extractEducation(educationHtml),
          experience: extractExperience(experienceHtml),
          volunteering: extractVolunteering(volunteeringHtml),
        };

        output.textContent = JSON.stringify(extractedData, null, 2);
      } catch (error) {
        output.textContent =
          error instanceof Error ? error.message : "Failed to run extractor test.";
      }
    </script>
  </body>
</html>
